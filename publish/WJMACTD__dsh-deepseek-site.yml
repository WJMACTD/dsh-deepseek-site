url: https://github.com/WJMACTD/dsh-deepseek-site
name: WJMACTD/dsh-deepseek-site
category: ui
description:
  en: "A left-rail entry that renders the official chat.deepseek.com page in the app main panel through the desktop shell's native browser guest, keeping the site's own model picker and history. The page lives outside React, so switching to another panel and back never reloads it and a streaming answer keeps going; the top inset follows the platform, so Windows does not double the caption height. Sign-in is snapshotted locally and replayed before the site boots, so a restart lands already signed in; off-site links go to the system browser. Desktop only; where the guest bridge is missing it shows an unsupported notice instead of opening a browser."
  zh: "在左侧栏加一个入口，用桌面端原生浏览器访客在中央面板里渲染 chat.deepseek.com 官方页面，保留官方的模型选择与历史记录。页面常驻在 React 之外，切到别的面板再回来不重载，流式回答继续；顶部留白按平台计算，Windows 不再重复叠加标题栏高度。登录快照存在本机，并在站点脚本启动前回填，重启后直接是登录态；站外链接交给系统浏览器。仅桌面端；宿主没有该访客桥接时显示不支持提示，而不是跳系统浏览器。"
